<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multiplier</title>
  <style>
    :root { --mult-color: #4ade80; --mult-shadow: rgba(74, 222, 128, 0.35); --mult-glow: rgba(74, 222, 128, 0.20); }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", "Courier New", monospace; }
    .wrap { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; padding:8px; background:transparent; gap:8px; }
    #mult-time { color:var(--mult-color); font-size:clamp(32px, 7vw, 80px); font-weight:950; line-height:1; letter-spacing:.015em; white-space:nowrap; font-variant-numeric:tabular-nums; text-shadow:0 3px 10px var(--mult-shadow),0 0 24px var(--mult-glow); display:none; }
    #multiplier-badge { flex:0 0 auto; width:clamp(96px, 18vw, 220px); height:clamp(96px, 18vw, 220px); filter:drop-shadow(0 0 20px rgba(255,180,0,0.6)) drop-shadow(0 0 40px rgba(255,120,0,0.3)); animation:multPulse 1.8s ease-in-out infinite; display:none; }
    #multiplier-badge img { width:100%; height:100%; object-fit:contain; }
    @keyframes multPulse { 0%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(255,180,0,0.6)) drop-shadow(0 0 40px rgba(255,120,0,0.3));} 50%{transform:scale(1.08);filter:drop-shadow(0 0 30px rgba(255,180,0,0.9)) drop-shadow(0 0 56px rgba(255,120,0,0.6));} 100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(255,180,0,0.6)) drop-shadow(0 0 40px rgba(255,120,0,0.3));} }
  </style>
</head>
<body>
  <main class="wrap" aria-label="Multiplier">
    <div id="mult-time"></div>
    <div id="multiplier-badge"><img src="/assets/x2.png" alt="2x Multiplier" /></div>
  </main>
<script>
const badgeEl=document.getElementById('multiplier-badge');
const timeEl=document.getElementById('mult-time');
let rem=0,active=false,lastSync=Date.now(),ws=null,retryMs=500;
function pad(n){return String(Math.floor(n)).padStart(2,'0');}
function fmt(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h>0?pad(h)+':'+pad(m)+':'+pad(s):(m>0?pad(m)+':'+pad(s):'0:'+pad(s));}
function now(){return active&&rem>0?Math.max(0,rem-Math.floor((Date.now()-lastSync)/1000)):0;}
function render(sec){var r=Math.max(0,Math.floor(sec));if(r>0){badgeEl.style.display='block';timeEl.style.display='block';timeEl.textContent=fmt(r);}else{badgeEl.style.display='none';timeEl.style.display='none';timeEl.textContent='';}}
function upd(d){if(typeof d.multiplier_active==='boolean')active=d.multiplier_active;if(typeof d.multiplier_remaining_seconds==='number')rem=Math.max(0,Math.floor(d.multiplier_remaining_seconds));lastSync=Date.now();render(now());}
function connect(){var p=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(p+'//'+location.host+'/ws');ws.onopen=function(){retryMs=500;try{ws.send('hello');}catch(_){}};ws.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(d.type==='timer_state')upd(d);}catch(e){console.error(e);}};ws.onclose=function(){setTimeout(connect,retryMs);retryMs=Math.min(10000,Math.floor(retryMs*1.7));};ws.onerror=function(){try{ws.close();}catch(_){}};}
setInterval(function(){render(now());},200);connect();
</script>
</body>
</html>
