<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stream Alerts</title>
  <style>
    :root {
      --glass: rgba(13, 17, 27, 0.80);
      --border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --bits: #67e8f9;
      --subs: #f59e0b;
      --money: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 34px;
      pointer-events: none;
    }
    .alert {
      opacity: 0;
      transform: translateX(-70px) scale(0.985);
      display: flex;
      align-items: center;
      gap: 24px;
      max-width: 980px;
      min-width: 700px;
      padding: 22px 30px 22px 22px;
      border-radius: 34px;
      background:
        radial-gradient(circle at 18% 0%, rgba(139, 92, 246, 0.24), transparent 38%),
        linear-gradient(135deg, rgba(30, 41, 59, 0.88), var(--glass));
      border: 1px solid var(--border);
      box-shadow: 0 28px 90px rgba(0,0,0,0.50), inset 0 1px 0 rgba(255,255,255,0.09);
      backdrop-filter: blur(12px);
    }
    .alert.show {
      animation: slideIn 650ms cubic-bezier(.16,1,.3,1) forwards,
                 floaty 2800ms ease-in-out 650ms infinite alternate;
    }
    .alert.hide {
      animation: slideOut 650ms cubic-bezier(.7,0,.84,0) forwards;
    }
    .peepo {
      width: 170px;
      height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 16px 26px rgba(0,0,0,0.34));
      flex: 0 0 auto;
    }
    .content { flex: 1; min-width: 0; }
    .headline { display: none; }
    .message {
      color: var(--text);
      font-size: 31px;
      line-height: 1.22;
      font-weight: 800;
    }
    .user {
      color: #ffffff;
      text-shadow: 0 0 18px rgba(255,255,255,0.20);
    }
    .value.bits { color: var(--bits); text-shadow: 0 0 22px rgba(103,232,249,0.30); }
    .value.sub, .value.gift_sub { color: var(--subs); text-shadow: 0 0 22px rgba(245,158,11,0.35); }
    .value.money { color: var(--money); text-shadow: 0 0 22px rgba(74,222,128,0.32); }
    .added {
      margin-top: 12px;
      color: var(--muted);
      font-size: 20px;
      font-weight: 700;
    }
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(-90px) scale(0.96); filter: blur(3px); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }
    @keyframes slideOut {
      0% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateX(80px) scale(0.96); filter: blur(4px); }
    }
    .debug {
      display: none;
      position: fixed;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font: 13px ui-monospace, monospace;
    }
    body.debug-mode { background: rgba(15, 23, 42, 0.92); }
    body.debug-mode .debug { display: block; }
    @keyframes floaty {
      from { transform: translateY(0); }
      to { transform: translateY(-7px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section id="alert" class="alert" aria-live="polite">
      <img id="emote" class="peepo" src="/assets/3368-peepolove_2.png" alt="Alert Emote" />
      <div class="content">
        <div class="headline" aria-hidden="true"></div>
        <div id="message" class="message"></div>
        <div id="added" class="added"></div>
      </div>
    </section>
  </main>
  <div id="debugStatus" class="debug">Verbinde…</div>

  <script>
    const alertEl = document.getElementById('alert');
    const emoteEl = document.getElementById('emote');
    const messageEl = document.getElementById('message');
    const addedEl = document.getElementById('added');
    const debugStatusEl = document.getElementById('debugStatus');
    if (new URLSearchParams(location.search).has('debug')) document.body.classList.add('debug-mode');

    const queue = [];
    let showing = false;
    let socket = null;
    let retryMs = 500;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    function formatAmount(event) {
      const type = event.event_type || 'money';
      const amount = Number(event.amount || 0);
      if (type === 'bits') return `${Math.round(amount)} Bits`;
      if (type === 'sub' || type === 'gift_sub') return `${Math.round(amount)} ${Math.round(amount) === 1 ? 'Sub' : 'Subs'}`;
      return `${amount.toLocaleString('de-DE', { maximumFractionDigits: 2 })}$`;
    }

    function enqueue(event) {
      queue.push(event);
      if (!showing) runQueue();
    }

    async function runQueue() {
      if (showing) return;
      showing = true;
      while (queue.length) {
        await showAlert(queue.shift());
      }
      showing = false;
    }

    function showAlert(event) {
      return new Promise(resolve => {
        const type = event.event_type || 'money';
        const user = escapeHtml(event.username || 'Unbekannt');
        const amountText = escapeHtml(formatAmount(event));
        const seconds = Number(event.seconds_added || 0);

        // Nur Sub-/Gift-Sub-Alerts verwenden das alternative Emote.
        // Bits und Ingame-Dollar bleiben beim Peepo-Love-Emote.
        const isSubAlert = type === 'sub' || type === 'gift_sub';
        emoteEl.src = type === 'money' ? '/assets/peepo_minecraft.png' : (isSubAlert ? '/assets/sub-emote.png' : '/assets/3368-peepolove_2.png');

        messageEl.innerHTML = `<span class="user">${user}</span> hat <span class="value ${type}">${amountText}</span> gespendet!`;
        addedEl.textContent = seconds > 0 ? `+${seconds.toLocaleString('de-DE')} Sekunden auf den Timer` : '';

        alertEl.classList.remove('hide');
        alertEl.classList.add('show');

        const visibleMs = 6200;
        setTimeout(() => {
          alertEl.classList.remove('show');
          alertEl.classList.add('hide');
          setTimeout(resolve, 750);
        }, visibleMs);
      });
    }

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      socket = new WebSocket(`${protocol}//${location.host}/ws`);

      socket.addEventListener('open', () => {
        retryMs = 500;
        debugStatusEl.textContent = 'WebSocket verbunden';
        try { socket.send('hello'); } catch (_) {}
      });

      socket.addEventListener('message', event => {
        debugStatusEl.textContent = 'Nachricht empfangen';
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'alert') enqueue(data);
        } catch (err) {
          console.error('Ungültige WebSocket-Nachricht', err);
        }
      });

      socket.addEventListener('close', () => {
        debugStatusEl.textContent = `WebSocket getrennt - Reconnect in ${Math.round(retryMs / 1000)}s`;
        setTimeout(connect, retryMs);
        retryMs = Math.min(10000, Math.floor(retryMs * 1.7));
      });

      socket.addEventListener('error', () => {
        debugStatusEl.textContent = 'WebSocket Fehler';
        try { socket.close(); } catch (_) {}
      });
    }

    connect();

    // Browser-Test ohne Backend-Event: /alert.html?preview=1 oder /alert.html?test=1
    const params = new URLSearchParams(location.search);
    if (params.has('preview') || params.has('test')) {
      document.body.classList.add('debug-mode');
      setTimeout(() => enqueue({
        type: 'alert',
        event_type: params.get('type') || 'sub',
        username: params.get('username') || 'PreviewUser',
        amount: Number(params.get('amount') || 1),
        seconds_added: Number(params.get('seconds') || 1200),
        source: 'preview'
      }), 500);
    }
  </script>
</body>
</html>
